
name: AC-TechDesk Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py create_admin.py

      - name: Test Flask application
        env:
          SECRET_KEY: github-actions-test-secret
        run: |
          python - <<'PY'
          from pathlib import Path
          from app import app, initialize_database

          initialize_database()

          assert Path("templates/knowledge_base.html").is_file()

          client = app.test_client()

          assert client.get("/login").status_code == 200
          assert client.get("/").status_code == 302
          assert client.get("/admin/reports").status_code == 302

          print("AC-TechDesk basic tests passed!")
          PY
